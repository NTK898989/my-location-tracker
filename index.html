<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📍 Check Location</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;}
        body{font-family:system-ui;background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);min-height:100vh;display:flex;align-items:center;justify-content:center;}
        .container{background:white;padding:2rem;border-radius:20px;box-shadow:0 20px 40px rgba(0,0,0,0.1);text-align:center;max-width:400px;width:90%;}
        h1{color:#333;margin-bottom:1rem;font-size:2rem;}
        .status{margin:1rem 0;padding:1rem;border-radius:10px;font-weight:500;}
        .status.tracking{background:#d1ecf1;color:#0c5460;}
        .status.success{background:#d4edda;color:#155724;}
        .status.error{background:#f8d7da;color:#721c24;}
        .track-btn{background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);color:white;border:none;padding:1rem 2rem;font-size:1.1rem;border-radius:50px;cursor:pointer;width:100%;transition:transform .2s;}
        .track-btn:hover{transform:translateY(-2px);}
        .track-btn:disabled{opacity:.6;cursor:not-allowed;}
        .result{margin-top:2rem;text-align:left;}
        #coords{background:#f8f9fa;padding:1rem;border-radius:10px;margin-bottom:1rem;font-family:monospace;word-break:break-all;}
        .hidden{display:none!important;}
        #map{height:200px;background:#e9ecef;border-radius:10px;margin-top:1rem;}
    </style>
</head>
<body>
    <div class="container">
        <h1>📍 Check Your Location</h1>
        <p>Nhấn nút để chia sẻ vị trí</p>
        <div id="status" class="status">Sẵn sàng...</div>
        <button id="trackBtn" class="track-btn">📱 Share Location</button>
        <div id="result" class="result hidden">
            <h3>✅ Vị trí của bạn:</h3>
            <div id="coords"></div>
            <div id="map"></div>
        </div>
    </div>
    <script>
        document.addEventListener('DOMContentLoaded',function(){
            const trackBtn=document.getElementById('trackBtn');
            const status=document.getElementById('status');
            const result=document.getElementById('result');
            const coordsDiv=document.getElementById('coords');
            const mapDiv=document.getElementById('map');

            trackBtn.addEventListener('click',getLocation);

            function getLocation(){
                status.textContent='Đang lấy vị trí...';
                status.className='status tracking';
                trackBtn.disabled=true;

                if(!navigator.geolocation){
                    showError('Trình duyệt không hỗ trợ');
                    return;
                }

                navigator.geolocation.getCurrentPosition(onLocationSuccess,onLocationError,{enableHighAccuracy:true,timeout:10000});
            }

            function onLocationSuccess(position){
                const lat=position.coords.latitude;
                const lng=position.coords.longitude;
                const accuracy=position.coords.accuracy;
                const timestamp=new Date().toLocaleString();

                // 🔥 LOCATION DATA
                const locationData={latitude:lat,longitude:lng,accuracy:accuracy+'m',timestamp:timestamp,link:window.location.href};
                console.table(locationData);
                alert(`📍 LOCATION:\n${lat}, ${lng}\nAcc: ${accuracy}m`);

                status.textContent='✅ Thành công!';
                status.className='status success';

                coordsDiv.innerHTML=`Lat: ${lat.toFixed(6)}<br>Lng: ${lng.toFixed(6)}<br>Acc: ${accuracy}m<br>Time: ${timestamp}`;
                showMap(lat,lng);
                result.classList.remove('hidden');
                trackBtn.textContent='✅ Đã chia sẻ';
            }

            function onLocationError(error){
                showError('Từ chối vị trí hoặc lỗi');
            }

            function showError(message){
                status.textContent=message;
                status.className='status error';
                trackBtn.disabled=false;
                trackBtn.textContent='Thử lại';
            }

            function showMap(lat,lng){
                mapDiv.innerHTML=`<iframe width="100%" height="100%" frameborder="0" src="https://www.openstreetmap.org/export/embed.html?bbox=${lng-0.01},${lat-0.01},${lng+0.01},${lat+0.01}&layer=mapnik&marker=${lat},${lng}"></iframe>`;
            }
        });
    </script>
</body>
</html>
